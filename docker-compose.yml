services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: gt_main
      POSTGRES_USER: gametracker
      POSTGRES_PASSWORD: local_dev_only_change_me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gametracker -d gt_main"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - rds:/data

volumes:
  pg:
  rds:
